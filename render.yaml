# Render blueprint — Kaushal AI backend as a single web service.
#
#   render blueprint launch        # after the repo is connected to Render
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kaushai-api
    runtime: docker
    repo: https://github.com/<OWNER>/<REPO>   # set when launching, or connect in UI
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: KAUSHAI_ENV
        value: production
      - key: KAUSHAI_DEBUG
        value: "false"
      # Single worker on purpose. Phone-verification codes live in the cache,
      # and without REDIS_URL that cache is per-process — with 2 workers a code
      # issued by one would be unverifiable by the other, failing roughly half
      # of all sign-ups. Set REDIS_URL (below) and this can go back up.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # Render Postgres or Supabase pooled connection string
        sync: false
      - key: CORS_ORIGINS          # e.g. https://kaushai.vercel.app
        sync: false
      - key: AI_STT_PROVIDER
        value: mock
      - key: AI_LLM_PROVIDER
        value: mock
      - key: AI_TTS_PROVIDER
        value: mock
      - key: AI_TRANSLATE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false

# Redis is omitted so this stays a single deployable service; the app falls back
# to an in-process cache. Setting REDIS_URL moves phone-verification codes into
# shared storage, which is the prerequisite for raising WEB_CONCURRENCY above 1.
#
# The app's AI features (interviewer phrasing, assistant chat) need these two:
#   AI_LLM_PROVIDER=groq
#   GROQ_API_KEY=<your key>          # GROQ_MODEL defaults to openai/gpt-oss-120b
# Without them the backend serves its deterministic, record-grounded fallback.
